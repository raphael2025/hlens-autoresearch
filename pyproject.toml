# Python 版本由 ADR-0003 固定（3.13 + uv），与系统 Python 隔离。
# 依赖保持最小：契约（pydantic）+ 工程基线（pytest / ruff / mypy）。

[project]
name = "hlens-autoresearch"
version = "0.0.0"
description = "Modular, pluggable, verifiable automated research infrastructure for crypto markets."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
    "pyiceberg[pyarrow,pyiceberg-core,sql-postgres]>=0.12.0",
]

[project.optional-dependencies]
# ADR-0063: the local read-only API runtime (127.0.0.1 only), not a default dependency.
api-server = ["uvicorn==0.53.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps", "core", "infrastructure", "plugins", "research", "tests"]

[[tool.mypy.overrides]]
# ADR-0063: uvicorn is the optional api-server extra, absent from a default environment.
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true
